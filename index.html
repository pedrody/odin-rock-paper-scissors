<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="container">
        <h1>ROCK PAPER SCISSORS</h1>
        <div id="card">
            <p id="round-result"></p>
            <div id="scoreboard">
                <div id="player">
                    <p id="player-choice">?</p>
                    <p id="player-score">You: 0</p>
                </div>
                <div class="computer">
                    <p id="computer-choice">?</p>
                    <p id="computer-score">Computer: 0</p>
                </div>
            </div>
        </div>
        <div id="options">
            <button id="rock">✊</button>
            <button id="paper">🤚</button>
            <button id="scissors">✌️</button>
            <button id="play-again" style="display: none">Play again</button>
        </div>
    </div>
</body>
</html>
